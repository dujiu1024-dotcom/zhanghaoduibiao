name: Validate Stage 8 evidence register

on:
  pull_request:
    paths:
      - "08-验收与案例/**"
      - "scripts/validate-stage8-evidence-register.mjs"
      - ".github/workflows/validate-stage8-evidence-register.yml"
  push:
    branches: [main]
    paths:
      - "08-验收与案例/**"
      - "scripts/validate-stage8-evidence-register.mjs"
      - ".github/workflows/validate-stage8-evidence-register.yml"

permissions:
  contents: read

jobs:
  evidence-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install JSON Schema validator
        run: npm install --no-save ajv@8 ajv-formats@3
      - name: Validate tracked Stage 8 run manifests
        run: node scripts/validate-stage8-evidence-register.mjs
