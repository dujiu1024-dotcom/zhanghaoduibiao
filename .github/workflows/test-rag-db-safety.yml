name: RAG database safety tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "04-知识底座/rag/**"
      - "04-知识底座/catalog/check_data.py"
      - "04-知识底座/验收/check_recall.py"
      - ".github/workflows/test-rag-db-safety.yml"
  push:
    branches: [main]
    paths:
      - "04-知识底座/rag/**"
      - "04-知识底座/catalog/check_data.py"
      - "04-知识底座/验收/check_recall.py"

jobs:
  db-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run database safety regression tests
        run: python "04-知识底座/rag/test_db_safety.py"
